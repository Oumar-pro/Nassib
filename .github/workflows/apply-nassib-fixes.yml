name: Apply Nassib data-source fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch App.tsx
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.tsx'); s=p.read_text()
          def rep(old,new):
              global s
              if old not in s: raise SystemExit('Expected source fragment not found: '+old[:300])
              s=s.replace(old,new,1)
          rep("""  getProfiles,\n  getMyProfile,\n  saveMyProfile,""", """  getProfiles,\n  getMyProfile,\n  getMyProfileStats,\n  recordProfileView,\n  saveMyProfile,""")
          rep("""function getStoredPhotoBlur(): boolean {\n  try {\n    const val = localStorage.getItem('nassib_photo_blur');\n    if (val !== null) return val === 'true';\n  } catch {}\n  return true;\n}\n\n""", "")
          rep("""photoBlurringActive: getStoredPhotoBlur(), photoUrl: '',""", """photoBlurringActive: false, photoUrl: '',""")
          rep("""  const photoBlurringActive = profile\n    ? Boolean(profile.photoPrivate)\n    : (currentBlur !== undefined ? currentBlur : getStoredPhotoBlur());""", """  const photoBlurringActive = profile\n    ? Boolean(profile.photoPrivate)\n    : Boolean(currentBlur);""")
          old="""  const loadDatabaseState = useCallback(async (userId: string) => {\n    if (!userId) return;\n    const myProfile = await getMyProfile(userId);\n    if (myProfile) setCurrentUserProfile(myProfile);\n\n    const [dbProfiles, dbFavorites, dbConversations, approvedPhotos, recPhotoReqs, sentPhotoReqs] = await Promise.all([\n      getProfiles(userId),\n      getFavorites(userId),\n      fetchConversationsFromSupabase(myProfile?.id),\n      myProfile?.id ? fetchApprovedPhotoAccessProfileIds(myProfile.id) : Promise.resolve([]),\n      myProfile?.id ? fetchReceivedPhotoAccessRequests(myProfile.id) : Promise.resolve([]),\n      myProfile?.id ? fetchSentPhotoAccessRequests(myProfile.id) : Promise.resolve([]),\n    ]);\n\n    const validProfiles = (dbProfiles || []).filter(hasUploadedPhotos);\n    setProfiles(validProfiles);\n    setFavoriteProfileIds(dbFavorites);\n    setConversations(dbConversations);\n    setApprovedPhotoIds(approvedPhotos);\n    setReceivedPhotoRequests(recPhotoReqs);\n    setSentPhotoRequests(sentPhotoReqs);\n\n    const account = getCurrentUserSession();\n    if (account) {\n      setUser((prev) => accountToUser(account, myProfile, myProfile ? myProfile.photoPrivate : prev.photoBlurringActive));\n    }\n  }, []);"""
          new="""  const loadDatabaseState = useCallback(async (userId: string) => {\n    if (!userId) return;\n    const myProfile = await getMyProfile(userId);\n    if (myProfile) setCurrentUserProfile(myProfile);\n\n    const [dbProfiles, dbFavorites, dbConversations, approvedPhotos, recPhotoReqs, sentPhotoReqs, dbStats] = await Promise.all([\n      getProfiles(userId),\n      getFavorites(userId),\n      fetchConversationsFromSupabase(myProfile?.id),\n      myProfile?.id ? fetchApprovedPhotoAccessProfileIds(myProfile.id) : Promise.resolve([]),\n      myProfile?.id ? fetchReceivedPhotoAccessRequests(myProfile.id) : Promise.resolve([]),\n      myProfile?.id ? fetchSentPhotoAccessRequests(myProfile.id) : Promise.resolve([]),\n      getMyProfileStats(),\n    ]);\n\n    const validProfiles = (dbProfiles || []).filter(hasUploadedPhotos);\n    setProfiles(validProfiles);\n    setFavoriteProfileIds(dbFavorites);\n    setConversations(dbConversations);\n    setApprovedPhotoIds(approvedPhotos);\n    setReceivedPhotoRequests(recPhotoReqs);\n    setSentPhotoRequests(sentPhotoReqs);\n\n    const account = getCurrentUserSession();\n    if (account) {\n      setUser((prev) => {\n        const next = accountToUser(account, myProfile, myProfile?.photoPrivate ?? prev.photoBlurringActive);\n        if (dbStats) next.stats = { ...next.stats, ...dbStats };\n        return next;\n      });\n    }\n  }, []);"""
          rep(old,new)
          rep("""    const myProfile = await getMyProfile(account.id);\n    setCurrentUserProfile(myProfile);\n    setUser(accountToUser(account, myProfile));\n    await loadDatabaseState(account.id);""", """    await loadDatabaseState(account.id);""")
          old="""  const handleToggleFavorite = async (profileId: string) => {\n    if (!user.id) return showToast('Veuillez vous connecter pour enregistrer vos favoris.');\n    const isCurrentlyFavorited = favoriteProfileIds.includes(profileId);\n    setFavoriteProfileIds((prev) =>\n      isCurrentlyFavorited ? prev.filter((id) => id !== profileId) : [...prev, profileId]\n    );\n    const success = await toggleFavorite(user.id, profileId);\n    if (!success) {\n      setFavoriteProfileIds((prev) =>\n        isCurrentlyFavorited ? [...prev, profileId] : prev.filter((id) => id !== profileId)\n      );\n      return showToast('Impossible de modifier vos favoris. Réessayez.');\n    }\n    const profile = profiles.find((p) => p.id === profileId);\n    showToast(\n      !isCurrentlyFavorited\n        ? `❤️ ${profile?.name || 'Profil'} ajouté(e) à vos favoris.`\n        : `${profile?.name || 'Profil'} retiré(e) de vos favoris.`\n    );\n  };"""
          new="""  const handleToggleFavorite = async (profileId: string) => {\n    if (!user.id) return showToast('Veuillez vous connecter pour enregistrer vos favoris.');\n    const wasFavorited = favoriteProfileIds.includes(profileId);\n    const success = await toggleFavorite(user.id, profileId);\n    if (!success) return showToast('Impossible de modifier vos favoris. Réessayez.');\n    const freshFavorites = await getFavorites(user.id);\n    setFavoriteProfileIds(freshFavorites);\n    const profile = profiles.find((p) => p.id === profileId);\n    showToast(!wasFavorited ? `❤️ ${profile?.name || 'Profil'} ajouté(e) à vos favoris.` : `${profile?.name || 'Profil'} retiré(e) de vos favoris.`);\n  };"""
          rep(old,new)
          old="""  const handleTogglePhotoBlurring = async () => {\n    if (!user.id) return;\n    const next = !user.photoBlurringActive;\n    try {\n      localStorage.setItem('nassib_photo_blur', String(next));\n    } catch {}\n\n    setUser((u) => ({ ...u, photoBlurringActive: next }));\n    setCurrentUserProfile((prev) => prev ? { ...prev, photoPrivate: next } : null);\n\n    await updatePhotoPrivacy(user.id, next);\n    await loadDatabaseState(user.id);\n\n    showToast(\n      next\n        ? 'Mode Floutage activé : vos photos sont désormais floutées et protégées.'\n        : 'Mode Floutage désactivé : vos photos sont désormais visibles.'\n    );\n  };"""
          new="""  const handleTogglePhotoBlurring = async () => {\n    if (!user.id) return;\n    const next = !user.photoBlurringActive;\n    const saved = await updatePhotoPrivacy(user.id, next);\n    if (!saved) return showToast('Impossible d’enregistrer le mode Floutage dans Supabase.');\n    const freshProfile = await getMyProfile(user.id);\n    if (!freshProfile) return showToast('Préférence enregistrée mais profil introuvable.');\n    setCurrentUserProfile(freshProfile);\n    const account = getCurrentUserSession();\n    if (account) setUser((prev) => accountToUser(account, freshProfile, freshProfile.photoPrivate));\n    showToast(next ? 'Mode Floutage activé : vos photos sont désormais protégées.' : 'Mode Floutage désactivé : vos photos sont désormais visibles.');\n  };"""
          rep(old,new)
          rep("""    if (updated.photoBlurringActive !== undefined) {\n      try {\n        localStorage.setItem('nassib_photo_blur', String(updated.photoBlurringActive));\n      } catch {}\n      setUser((prev) => ({ ...prev, photoBlurringActive: updated.photoBlurringActive! }));\n      setCurrentUserProfile((prev) => prev ? { ...prev, photoPrivate: updated.photoBlurringActive! } : null);\n      await updatePhotoPrivacy(user.id, updated.photoBlurringActive);\n    }""", """    if (updated.photoBlurringActive !== undefined) {\n      const privacySaved = await updatePhotoPrivacy(user.id, updated.photoBlurringActive);\n      if (!privacySaved) return showToast('Impossible d’enregistrer cette préférence dans Supabase.');\n    }""")
          marker="""  const handleOpenAuth = (mode: 'login' | 'register') => { setAuthMode(mode); setCurrentTab('auth'); };\n"""
          helper="""  const handleSelectProfile = async (profile: Profile, destination: TabType) => {\n    setReturnTab(destination);\n    setSelectedProfile(profile);\n    setCurrentTab('profile-detail');\n    if (user.profileId && profile.id !== user.profileId) await recordProfileView(profile.id);\n  };\n\n"""
          rep(marker, helper+marker)
          rep("""                        setReturnTab('dashboard');\n                        setSelectedProfile(profile);\n                        setCurrentTab('profile-detail');""", """                        void handleSelectProfile(profile, 'dashboard');""")
          rep("""                        setReturnTab('browse');\n                        setSelectedProfile(profile);\n                        setCurrentTab('profile-detail');""", """                        void handleSelectProfile(profile, 'browse');""")
          rep("""                        setReturnTab('requests');\n                        const found = profiles.find((p) => p.id === profileId);\n                        if (found) {\n                          setSelectedProfile(found);\n                          setCurrentTab('profile-detail');\n                        }""", """                        const found = profiles.find((p) => p.id === profileId);\n                        if (found) void handleSelectProfile(found, 'requests');""")
          rep("""                        setReturnTab('messages');\n                        const found = profiles.find((p) => p.id === profileId);\n                        if (found) {\n                          setSelectedProfile(found);\n                          setCurrentTab('profile-detail');\n                        } else {\n                          getProfileById(profileId).then((p) => {\n                            if (p) {\n                              setSelectedProfile(p);\n                              setCurrentTab('profile-detail');\n                            }\n                          });\n                        }""", """                        const found = profiles.find((p) => p.id === profileId);\n                        if (found) void handleSelectProfile(found, 'messages');\n                        else getProfileById(profileId).then((p) => { if (p) void handleSelectProfile(p, 'messages'); });""")
          p.write_text(s)
      - name: Verify no browser storage usage
        run: if grep -RInE 'localStorage|sessionStorage' src; then exit 1; fi
      - name: Install and validate
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit patched source and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/apply-nassib-fixes.yml
          git commit -m 'fix: remove client storage and sync profile state with Supabase'
          git rm .github/workflows/apply-nassib-fixes.yml
          git commit -m 'chore: remove one-time repair workflow'
          git push
